name: Engine CI

# Engine tests also guard sources outside engine/: the conformance fixtures
# (protocol-tests/), the guides, skills and plugin manifests staged into the
# engine by `go generate`, and the exit-code table in docs/guides/cli.md.
on:
  push:
    paths:
      - "engine/**"
      - "proto/**"
      - "protocol-tests/**"
      - "docs/guides/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - "VERSION"
      - ".github/workflows/ci-engine.yml"
    branches: [main]
  pull_request:
    paths:
      - "engine/**"
      - "proto/**"
      - "protocol-tests/**"
      - "docs/guides/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - "VERSION"
      - ".github/workflows/ci-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Run tests
        run: cd engine && go test ./... -v -race
      - name: Vet
        run: cd engine && go vet ./...
      - name: Vulnerability check
        continue-on-error: true
        run: |
          cd engine
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Build engine binary
        run: cd engine && go build -o ../bin/attest-engine ./cmd/attest-engine/
      - name: Verify binary
        run: ./bin/attest-engine version
      - uses: actions/upload-artifact@v7
        with:
          name: attest-engine-linux-amd64
          path: bin/attest-engine
