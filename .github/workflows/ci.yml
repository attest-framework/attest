name: CI

# The single PR gate. Every suite that used to be its own path-filtered
# workflow is a job here, gated on the `changes` job. A job that is skipped
# because nothing it guards changed counts as passing; `required` is the one
# check that always reports, so branch protection can require it without a
# path-filtered check ever sitting "pending" forever.
#
# Engine tests also guard sources outside engine/: the conformance fixtures
# (protocol-tests/), the guides, skills and plugin manifests staged into the
# engine by `go generate`, and the exit-code table in docs/guides/cli.md. Both
# SDK suites read sdks/parity/ and protocol-tests/.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      sdk_typescript: ${{ steps.filter.outputs.sdk_typescript }}
      frameworks: ${{ steps.filter.outputs.frameworks }}
      setup_attest: ${{ steps.filter.outputs.setup_attest }}
      github_config: ${{ steps.filter.outputs.github_config }}
      versions: ${{ steps.filter.outputs.versions }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              - "engine/**"
              - "proto/**"
              - "protocol-tests/**"
              - "docs/guides/**"
              - "skills/**"
              - ".claude-plugin/**"
              - ".cursor-plugin/**"
              - ".codex-plugin/**"
              - "VERSION"
              - ".golangci.yml"
              - ".github/workflows/ci.yml"
            sdk_python:
              - "sdks/python/**"
              - "sdks/parity/**"
              - "protocol-tests/**"
              - "engine/**"
              - "proto/**"
              - ".github/workflows/ci.yml"
            sdk_typescript:
              - "sdks/typescript/**"
              - "sdks/parity/**"
              - "protocol-tests/**"
              - "engine/**"
              - ".github/workflows/ci.yml"
            frameworks:
              - "sdks/python/src/attest/adapters/**"
              - "sdks/python/tests/test_adapters/**"
              - "sdks/python/tests/test_adapter_conformance.py"
              - "sdks/python/tests/adapter_conformance.py"
              - "sdks/python/tests/**/conftest.py"
              - "sdks/python/tests/integration/test_*_integration.py"
              - "sdks/python/pyproject.toml"
              - "sdks/python/uv.lock"
              - "sdks/typescript/packages/core/src/adapters/**"
              - "sdks/parity/**"
              - ".github/workflows/ci.yml"
            setup_attest:
              - ".github/actions/setup-attest/**"
              - ".github/workflows/ci.yml"
            github_config:
              - ".github/**"
              - "scripts/check-action-pins.py"
              - "sdks/python/src/attest/scaffold.py"
              - "sdks/typescript/packages/core/src/scaffold.ts"
            versions:
              - "VERSION"
              - "engine/internal/buildinfo/**"
              - "sdks/python/pyproject.toml"
              - "sdks/python/src/attest/__init__.py"
              - "sdks/typescript/packages/core/package.json"
              - "sdks/typescript/packages/core/src/version.ts"
              - "sdks/typescript/packages/vitest/package.json"
              - "scripts/verify-versions.sh"
              - ".github/workflows/ci.yml"
            release:
              - ".github/workflows/release.yml"
              - ".github/workflows/release-build.yml"
              - "scripts/check-release-tag.sh"
              - "scripts/engine-checksums.sh"
              - "scripts/npm-publish-dry-run.sh"
              - "scripts/release-notes.sh"
              - "scripts/test-release-scripts.sh"
              - "CHANGELOG.md"
              - "VERSION"
              - "sdks/python/pyproject.toml"
              - "sdks/typescript/packages/core/package.json"
              - "sdks/typescript/packages/vitest/package.json"

  engine-test:
    name: Engine tests
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Run tests
        run: cd engine && go test ./... -v -race
      - name: Cache prune-latency bound (no race detector)
        # The race build relaxes the prune-latency bound in internal/cache; the
        # tight 500 ms bound only runs without -race.
        run: cd engine && go test ./internal/cache/ -count=1
      - name: Vet
        run: cd engine && go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: engine
      - name: Vulnerability check
        continue-on-error: true
        run: |
          cd engine
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...


  engine-build:
    name: Engine build
    needs: engine-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Build engine binary
        run: cd engine && go build -o ../bin/attest-engine ./cmd/attest-engine/
      - name: Verify binary
        run: ./bin/attest-engine version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-engine-linux-amd64
          path: bin/attest-engine

  sdk-python:
    name: Python SDK (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: |
          cd sdks/python
          uv venv .venv
          uv pip install -e ".[dev]"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Build engine
        # Engine-backed tests (judge replay, capture, replay) skip without bin/attest-engine.
        run: make engine
      - name: Run tests
        run: |
          cd sdks/python
          uv run pytest tests/ -v
      - name: Lint
        run: |
          cd sdks/python
          uv run ruff check src tests
      - name: Format check
        run: |
          cd sdks/python
          uv run ruff format --check src tests
      - name: Type check
        run: |
          cd sdks/python
          uv run mypy --strict src/attest
      - name: Security audit
        # Audit the project's installed dependencies from an isolated pip-audit,
        # so the auditor's own dependencies are not part of the audited set.
        run: |
          cd sdks/python
          uv pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"


  sdk-typescript:
    name: TypeScript SDK (${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.sdk_typescript == 'true'
    defaults:
      run:
        working-directory: sdks/typescript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: Build engine
        # Engine-backed tests (replay end to end) skip without bin/attest-engine.
        working-directory: .
        run: make engine
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm -r build
      - name: Test
        run: pnpm -r test
      - name: Type check
        run: pnpm -r exec tsc --noEmit
      - name: Lint
        # Biome fails on any finding (including warnings); a planted `debugger;` exits 1.
        run: pnpm lint

  # @attest-ai/vitest declares peer vitest >=3.0.0 <6; the lockfile pins one 4.x. This job
  # runs the package suite (reporter, packaged /reporter and /setup subpaths, plugin) on the
  # newest 3.x, 4.x and 5.x. The dev dependency is overridden inside the job with `pnpm add -D
  # vitest@<major>` after a frozen install: pnpm resolves the newest release of that major,
  # rewrites package.json and the lockfile in the runner checkout only, and nothing is
  # committed. The resolved version is printed so the log shows what ran. That tree is not
  # covered by the lockfile, so this job neither restores nor saves the shared pnpm/Go caches.
  vitest-range:
    name: Vitest ${{ matrix.vitest-major }}.x integration
    needs: changes
    if: needs.changes.outputs.sdk_typescript == 'true'
    defaults:
      run:
        working-directory: sdks/typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vitest-major: ["3", "4", "5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Build engine
        # The packaged-subpath tests run a real engine; they skip without bin/attest-engine.
        working-directory: .
        run: make engine
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # Built once against the lockfile's Vitest, the way the package is published; the
        # override below changes only the runtime the built reporter and subpaths load into.
        run: pnpm -r build
      - name: Override Vitest to the latest ${{ matrix.vitest-major }}.x
        run: |
          pnpm --filter @attest-ai/vitest add -D "vitest@${{ matrix.vitest-major }}"
          resolved="$(pnpm --filter @attest-ai/vitest exec vitest --version)"
          echo "resolved: $resolved"
          case "$resolved" in
            vitest/${{ matrix.vitest-major }}.*) ;;
            *) echo "::error::expected vitest ${{ matrix.vitest-major }}.x, got $resolved"; exit 1 ;;
          esac
      - name: Test @attest-ai/vitest
        run: pnpm --filter @attest-ai/vitest test


  frameworks:
    name: Adapters against real frameworks
    needs: changes
    if: needs.changes.outputs.frameworks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # No caches: this job runs the most third-party code, and on main a save would be
      # restored by the other jobs.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Build engine
        # The conformance corpus drives the engine; it skips without bin/attest-engine.
        run: make engine
      - name: Install SDK with every framework extra
        # uv.lock pins crewai, langchain-core, google-adk, llama-index-core, openai,
        # anthropic, google-genai, ollama and opentelemetry; --locked fails when the lock
        # is out of date with pyproject.toml.
        run: |
          cd sdks/python
          uv sync --locked --extra dev --extra all
      - name: Run framework-gated adapter tests
        # pipefail: without it `| tee` hides a pytest failure.
        run: |
          set -euo pipefail
          cd sdks/python
          targets=(tests/test_adapters tests/integration/test_langchain_integration.py tests/integration/test_google_adk_integration.py tests/integration/test_crewai_integration.py)
          if [ -f tests/test_adapter_conformance.py ]; then
            targets+=(tests/test_adapter_conformance.py)
          fi
          uv run --no-sync pytest "${targets[@]}" -v -rs -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/frameworks.log"
          # importorskip turns a missing framework into a skip, which reads as green.
          # Every selected test must run here, so any skip fails the job.
          if grep -E '^SKIPPED' "$RUNNER_TEMP/frameworks.log"; then
            echo "::error::a framework-gated test was skipped; the framework must be installed and the engine built"
            exit 1
          fi

  setup-attest:
    name: setup-attest consumer (action from this change)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.setup_attest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: attest-action
          persist-credentials: false
      - uses: ./attest-action/.github/actions/setup-attest
        id: setup
        with:
          ref: main
      - name: Run engine and SDKs
        env:
          CORE_TARBALL: ${{ steps.setup.outputs.core-tarball }}
        run: |
          set -euo pipefail
          attest-engine version
          python -c 'import attest; print("attest-ai", attest.__version__)'
          project="$(mktemp -d)"
          cd "$project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$CORE_TARBALL"
          node --input-type=module -e 'const m = await import("@attest-ai/core"); console.log("@attest-ai/core", m.VERSION)'

  github-config:
    name: GitHub config
    needs: changes
    if: needs.changes.outputs.github_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: pr-annotate unit tests
        run: python3 -m unittest discover -s .github/actions/pr-annotate -v
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: dependabot.yml schema
        run: uvx check-jsonschema==0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: Action pins
        # --verify-remote also requires every pinned SHA to be the commit its version comment's
        # tag peels to on GitHub, so a SHA from a fork or another branch cannot pass.
        run: python3 scripts/check-action-pins.py --verify-remote
      - name: Scaffolded workflow (actionlint and action pins)
        run: |
          set -euo pipefail
          actionlint="$(go env GOPATH)/bin/actionlint"
          scratch="$(mktemp -d)"
          git init -q "$scratch"
          (cd "$scratch" && uv run --project "$GITHUB_WORKSPACE/sdks/python" attest init --ci github)
          python3 scripts/check-action-pins.py --verify-remote "$scratch/.github/workflows"
          (cd "$scratch" && "$actionlint" -color)

  versions:
    name: Version source of truth
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Verify version sources agree
        run: bash scripts/verify-versions.sh

  # The release dry run: release-build.yml builds and verifies every artifact
  # and publishes nothing. It requests read access only, so a pull-request run
  # holds no write or OIDC grant and a fork pull request can start it.
  release-dry-run:
    name: Release dry run
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml

  required:
    name: required
    if: always()
    needs:
      - changes
      - engine-test
      - engine-build
      - sdk-python
      - sdk-typescript
      - vitest-range
      - frameworks
      - setup-attest
      - github-config
      - versions
      - release-dry-run
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
