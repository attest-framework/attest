name: GitHub Config CI

# Validates workflow and Dependabot changes on the PRs that make them.
# Composite actions under .github/actions/ are only checked where a workflow uses them;
# the pr-annotate script's unit tests run here.
on:
  push:
    paths: [".github/**"]
    branches: [main]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: pr-annotate unit tests
        run: python3 -m unittest discover -s .github/actions/pr-annotate -v
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - uses: astral-sh/setup-uv@v7
      - name: dependabot.yml schema
        run: uvx check-jsonschema==0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml
