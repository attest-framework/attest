name: 'Attest PR Annotate'
description: |
  Summarise one or more report-v2 files (pytest --attest-report, Vitest
  AttestReporter) on a pull request. Posts one summary comment per PR,
  created on the first run and updated in place afterwards (hidden marker
  `<!-- attest:pr-annotate -->`), rendered by `attest-engine report summary`.
  It is posted only for pull requests from the same repository; fork PRs and
  tokens that cannot write get the summary in the job summary and a warning.
  The summary is always written to the job summary. Each failure and replay
  miss becomes a workflow annotation (::error / ::warning) at the file and
  line of its test, shown in the checks list and inline in the diff. Needs
  `pull-requests: write` for the comment and `contents: read`. Optionally
  evaluates a policy file per report and fails the step (exit 1) on a
  blocking violation; a warning (exit 2) does not fail it. Any other
  evaluator exit code (e.g. 127, engine not found) fails the step after the
  annotations are emitted.

inputs:
  report:
    description: 'Path to the report-v2 file (proto/attest/v1/report-v2.schema.json), or several paths separated by newlines or spaces. Row paths are resolved against the directory containing each report.'
    required: true
  policy:
    description: 'Optional path to attest.policy.yaml. When set, a blocking violation (exit 1) fails the step if fail-on-violation is true, a warning (exit 2) does not, and any other non-zero evaluator exit (e.g. 127, engine not found) always fails it.'
    required: false
    default: ''
  baseline-tag:
    description: 'Optional baseline tag to evaluate the policy against (regression rules).'
    required: false
    default: ''
  engine-binary:
    description: 'Path to attest-engine binary; defaults to attest-engine on PATH.'
    required: false
    default: 'attest-engine'
  github-token:
    description: 'GitHub token with pull-requests:write, used only for the summary comment. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  fail-on-violation:
    description: 'If true (default) and the policy blocks, exit non-zero so the workflow fails.'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'Exit code from the policy evaluator (0=pass, 1=block, 2=warn). 0 when no policy was given.'
    value: ${{ steps.evaluate.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Summarise and annotate
      id: evaluate
      shell: bash
      env:
        ATTEST_REPORT: ${{ inputs.report }}
        ATTEST_POLICY: ${{ inputs.policy }}
        ATTEST_BASELINE_TAG: ${{ inputs.baseline-tag }}
        ATTEST_ENGINE_BIN: ${{ inputs.engine-binary }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/post_annotations.py" \
          --report "$ATTEST_REPORT" \
          --policy "$ATTEST_POLICY" \
          --baseline-tag "$ATTEST_BASELINE_TAG" \
          --engine "$ATTEST_ENGINE_BIN"

    - name: Fail on blocking policy violation
      if: inputs.fail-on-violation == 'true' && steps.evaluate.outputs.exit_code == '1'
      shell: bash
      run: |
        echo "::error::Attest policy reported a blocking violation"
        exit 1

    - name: Fail on policy evaluator error
      if: >-
        steps.evaluate.outputs.exit_code != '0' &&
        steps.evaluate.outputs.exit_code != '1' &&
        steps.evaluate.outputs.exit_code != '2'
      shell: bash
      env:
        POLICY_EXIT_CODE: ${{ steps.evaluate.outputs.exit_code }}
      run: |
        echo "::error::attest-engine policy evaluate exited ${POLICY_EXIT_CODE} (expected 0 pass, 1 block or 2 warn); the policy was not evaluated (127: engine-binary not found)"
        exit 1
