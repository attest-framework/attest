name: 'Setup Attest'
description: |
  Install the Attest engine and Python SDK for CI. With `ref` empty the
  action builds from the calling workspace (an attest checkout). With `ref`
  set it fetches attest at that branch, tag or commit into a private path,
  builds the engine, installs the Python SDK and packs the TypeScript SDK
  tarballs, so any repository can test against unreleased attest.

inputs:
  go-version:
    description: 'Go version to install. Empty uses the version required by the attest engine/go.mod being built.'
    default: ''
  python-version:
    description: 'Python version to install'
    default: '3.12'
  install-extras:
    description: 'Python SDK extras to install (e.g. dev, test)'
    default: 'dev'
  ref:
    description: 'attest branch, tag or commit SHA to build from. Empty builds from the calling workspace.'
    default: ''
  node-version:
    description: 'Node.js version used to pack the TypeScript SDK when ref is set'
    default: '22'

outputs:
  engine-path:
    description: 'Absolute path to the built attest-engine binary'
    value: ${{ steps.paths.outputs.engine-path }}
  source-dir:
    description: 'Absolute path to the attest source the action built from'
    value: ${{ steps.paths.outputs.source-dir }}
  core-tarball:
    description: 'Path to the packed @attest-ai/core tarball (ref set only); install with `pnpm add <path>`'
    value: ${{ steps.typescript.outputs.core-tarball }}
  vitest-tarball:
    description: 'Path to the packed @attest-ai/vitest tarball (ref set only)'
    value: ${{ steps.typescript.outputs.vitest-tarball }}

runs:
  using: 'composite'
  steps:
    - name: Fetch attest source
      if: inputs.ref != ''
      shell: bash
      env:
        ATTEST_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/attest-src"
        rm -rf "$src"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 https://github.com/attest-framework/attest.git "$ATTEST_REF"
        git -C "$src" checkout -q --detach FETCH_HEAD
        echo "attest $ATTEST_REF -> $(git -C "$src" rev-parse HEAD)"

    - name: Resolve paths
      id: paths
      shell: bash
      env:
        ATTEST_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if [[ -n "$ATTEST_REF" ]]; then
          src="$RUNNER_TEMP/attest-src"
          bin="$RUNNER_TEMP/attest-bin"
        else
          src="$GITHUB_WORKSPACE"
          bin="$GITHUB_WORKSPACE/bin"
        fi
        echo "source-dir=$src" >> "$GITHUB_OUTPUT"
        echo "bin-dir=$bin" >> "$GITHUB_OUTPUT"
        echo "engine-path=$bin/attest-engine" >> "$GITHUB_OUTPUT"

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && format('{0}/engine/go.mod', steps.paths.outputs.source-dir) || '' }}
        cache-dependency-path: ${{ steps.paths.outputs.source-dir }}/engine/go.sum

    - name: Build engine
      shell: bash
      working-directory: ${{ steps.paths.outputs.source-dir }}/engine
      run: go build -o "${{ steps.paths.outputs.engine-path }}" ./cmd/attest-engine/

    - name: Add engine to PATH
      shell: bash
      run: echo "${{ steps.paths.outputs.bin-dir }}" >> "$GITHUB_PATH"

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: pip install uv

    - name: Install Python SDK
      shell: bash
      working-directory: ${{ steps.paths.outputs.source-dir }}/sdks/python
      run: uv pip install --system -e ".[${{ inputs.install-extras }}]"

    - name: Install Node.js
      if: inputs.ref != ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build and pack TypeScript SDK
      id: typescript
      if: inputs.ref != ''
      shell: bash
      working-directory: ${{ steps.paths.outputs.source-dir }}/sdks/typescript
      run: |
        set -euo pipefail
        npm install -g "$(jq -r .packageManager package.json)"
        pnpm install --frozen-lockfile
        pnpm -r build
        out="$RUNNER_TEMP/attest-npm"
        mkdir -p "$out"
        for pkg in core vitest; do
          (cd "packages/$pkg" && pnpm pack --pack-destination "$out")
        done
        echo "core-tarball=$(ls "$out"/attest-ai-core-*.tgz)" >> "$GITHUB_OUTPUT"
        echo "vitest-tarball=$(ls "$out"/attest-ai-vitest-*.tgz)" >> "$GITHUB_OUTPUT"
