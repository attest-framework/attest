version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7.0 ships no compiler API, so tsup's declaration build crashes (egoist/tsup#1405).
      # Revisit when Vitest and ESLint support TS 7 and tsup emits declarations with typescript@7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Every action is pinned to a commit SHA with its release in a trailing comment;
  # Dependabot rewrites both. scripts/check-action-pins.py fails CI on a tag pin.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/pr-annotate"
      - "/.github/actions/setup-attest"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
